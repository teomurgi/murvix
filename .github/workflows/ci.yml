name: ci

on:
  push:
    branches: [main, linux, linux-platform, 'linux/**']
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LIBGHOSTTY_VT_SYS_OPTIMIZE: ReleaseFast

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install neovim
      - run: python3 scripts/protocol_fixtures.py append-only --base "$PROTOCOL_BASE"
        env:
          PROTOCOL_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 scripts/check-desktop-macos.py
      - run: python3 scripts/protocol_fixtures.py last-release
      - run: python3 scripts/smoke-desktop-tui.py
  omarchy:
    # Native Arch check: Omarchy's distro, running the same full desktop
    # verification as linux-desktop. GitHub has no Arch runner, so this uses
    # an archlinux container (x86_64). Ubuntu jobs were removed in favor of
    # testing on the distro Murvix targets.
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: >-
          pacman -Syu --noconfirm
          base-devel pkgconf clang cmake openssl fontconfig freetype2 git python
          libxkbcommon libxkbcommon-x11 wayland libxcb vulkan-headers mesa vulkan-swrast
          webkit2gtk-4.1 xorg-server-xvfb
          zsh fish binutils vim less unzip neovim
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: xvfb-run -a python3 scripts/check-desktop-linux.py --target "x86_64-unknown-linux-gnu"
