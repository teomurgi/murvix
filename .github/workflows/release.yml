name: Release

# Builds macOS + Omarchy (Linux desktop) artifacts and publishes them on the
# GitHub release page. Dispatch on main with the next semver version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (X.Y.Z)"
        required: true
        type: string
      draft:
        description: "Create the GitHub release as a draft"
        required: false
        default: false
        type: boolean
      changelog:
        description: "Markdown release notes; leave empty to generate them from merged pull requests"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: murvix-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'teomurgi/murvix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.count.outputs.count }}
    steps:
      - name: Release only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Error: run Release on main, not ${GITHUB_REF#refs/heads/}" >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Validate the release version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release.py check-version "$VERSION"
          if git show-ref --verify --quiet "refs/tags/v$VERSION" \
            && [[ "$(git rev-parse "refs/tags/v$VERSION^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "Error: v$VERSION already points to a different commit" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Count commits for the macOS bundle version
        id: count
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source: ${{ github.sha }}
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: artifacts
      - name: Include the exact installers from this commit
        run: |
          cp scripts/install-murvix.sh scripts/install-desktop-linux.py artifacts/
          cp packaging/linux/murvix-desktop.apparmor artifacts/
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          DRAFT: ${{ inputs.draft }}
          RELEASE_NOTES: ${{ inputs.changelog }}
        run: bash scripts/publish-release.sh "$VERSION" artifacts

  # Runs main's script: the promoted checkout may predate it.
  notify-discord:
    needs: release
    if: ${{ !inputs.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Notify Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.prepare.outputs.version }}
        run: python3 scripts/notify-discord.py "$TAG"

  update-homebrew-tap:
    needs: release
    if: ${{ !inputs.draft }}
    uses: ./.github/workflows/update-homebrew-tap.yml
    with:
      tag: v${{ needs.prepare.outputs.version }}
    secrets: inherit
