name: Release

on:
  workflow_dispatch:
    inputs:
      retry_version:
        description: 'Retry an existing stable tag (e.g. 0.3.0), without a version bump; leave empty for a new release PR'
        required: false
        type: string
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: read

concurrency:
  group: murvix-release
  cancel-in-progress: false

jobs:
  propose:
    if: >-
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retry_version == '' &&
      github.repository == 'teomurgi/murvix' &&
      contains(fromJSON('["teomurgi"]'), github.actor) &&
      contains(fromJSON('["teomurgi"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Calculate the highest SemVer bump from unreleased commits
        id: plan
        run: |
          python3 scripts/release.py plan --source HEAD > "$RUNNER_TEMP/release-plan.json"
          cat "$RUNNER_TEMP/release-plan.json"
          VERSION=$(jq -r '.version // empty' "$RUNNER_TEMP/release-plan.json")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ -z "$VERSION" ]]; then
            echo 'No release-worthy commits since the last stable version.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Open a synchronized version PR
        if: steps.plan.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.plan.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Configure RELEASE_TOKEN with maintainer Contents and Pull requests write permissions}"
          SOURCE=$(git rev-parse HEAD)
          BRANCH="release/v$VERSION"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          if git ls-remote --exit-code --heads origin "$BRANCH"; then
            git fetch origin "refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            python3 scripts/release.py verify --source "$SOURCE" --release "origin/$BRANCH"
            git switch --track "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
            python3 scripts/release.py stamp "$VERSION"
            git add VERSION Cargo.toml Cargo.lock
            git commit -m "chore(release): $VERSION"
            git push --set-upstream origin "$BRANCH"
          fi
          PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')
          if [[ -z "$PR" ]]; then
            PR=$(gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "chore(release): $VERSION" \
              --body "Synchronize VERSION, the workspace package version, and every inherited crate lockfile version to $VERSION, derived from commit history. Merge after macos and omarchy pass to tag and publish this release. If main changes, close this PR, delete its branch, and run Release again rather than merging main into this branch.")
          fi
          echo "Release PR: $PR" >> "$GITHUB_STEP_SUMMARY"

  prepare:
    if: >-
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.retry_version != '') ||
       (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
        startsWith(github.event.pull_request.head.ref, 'release/v') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["teomurgi"]'), github.event.pull_request.user.login))) &&
      github.repository == 'teomurgi/murvix' &&
      contains(fromJSON('["teomurgi"]'), github.actor) &&
      contains(fromJSON('["teomurgi"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.version.outputs.source }}
      build_number: ${{ steps.version.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve and verify the exact release source
        id: version
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          RELEASE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          RETRY_VERSION: ${{ inputs.retry_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$RETRY_VERSION" ]]; then
            python3 scripts/release.py retry "$RETRY_VERSION" --main "$GITHUB_SHA" > "$RUNNER_TEMP/release-plan.json"
            if DRAFT=$(gh release view "v$RETRY_VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft); then
              [[ "$DRAFT" == true ]] || { echo 'Published releases are immutable; refusing retry.' >&2; exit 1; }
            fi
          else
            git fetch origin "$HEAD_SHA"
            PARENTS=$(git show -s --format=%P "$HEAD_SHA")
            if [[ "$PARENTS" == *' '* || -z "$PARENTS" ]]; then
              echo 'Release branch must contain one version commit on its source revision.' >&2
              exit 1
            fi
            python3 scripts/release.py verify --source "$PARENTS" --release "$RELEASE_SHA" > "$RUNNER_TEMP/release-plan.json"
            [[ "$HEAD_BRANCH" == "release/v$(jq -er '.version' "$RUNNER_TEMP/release-plan.json")" ]]
          fi
          VERSION=$(jq -er '.version' "$RUNNER_TEMP/release-plan.json")
          SOURCE=$(jq -er '.source' "$RUNNER_TEMP/release-plan.json")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "build_number=$(git rev-list --count "$SOURCE")" >> "$GITHUB_OUTPUT"
      - name: Tag the exact merged release commit
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE: ${{ steps.version.outputs.source }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?Configure RELEASE_TOKEN with administrator release-tag authority}"
          gh auth setup-git
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG"; then
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG"
            [[ "$(git rev-parse "$TAG^{commit}")" == "$SOURCE" ]]
          else
            git tag "$TAG" "$SOURCE"
            git push origin "refs/tags/$TAG"
          fi

  build:
    needs: prepare
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source: ${{ needs.prepare.outputs.source }}
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit

  release:
    needs: [prepare, build]
    # Manual approval gate: configure a `release-publish` environment with a
    # required reviewer (Settings → Environments). The workflow pauses here
    # after building and verifying, and publishes only once approved.
    environment: release-publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: artifacts
      - name: Include the exact installers from this commit
        run: |
          cp scripts/install-murvix.sh scripts/install-desktop-linux.py artifacts/
          cp packaging/linux/murvix-desktop.apparmor artifacts/
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build and pack marketplace extensions
        run: |
          set -euo pipefail
          # The committed manifest is authoritative: the app fetches it from
          # the tag, so rebuilt archives must match it byte for byte. pack.mjs
          # regenerates the file; any drift fails the release instead of
          # shipping zips the published manifest does not describe.
          cp extensions/manifest.json "$RUNNER_TEMP/committed-manifest.json"
          for extension in files git; do
            pushd "extensions/$extension"
            npm ci --no-audit --no-fund
            npm run build
            popd
          done
          node extensions/pack.mjs
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync(process.env.COMMITTED_MANIFEST, "utf8"));
            for (const entry of manifest) {
              const zip = `extensions/dist/${entry.archive}`;
              const data = fs.readFileSync(zip);
              if (data.length !== entry.size) throw new Error(`${zip}: size mismatch`);
              const crypto = require("node:crypto");
              const sha = crypto.createHash("sha256").update(data).digest("hex");
              if (sha !== entry.sha256) throw new Error(`${zip}: checksum mismatch; re-run node extensions/pack.mjs and commit extensions/manifest.json`);
            }
            console.log(`verified ${manifest.length} extension archives against the committed manifest`);
          '
        env:
          COMMITTED_MANIFEST: ${{ runner.temp }}/committed-manifest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/publish-release.sh "$VERSION" artifacts
