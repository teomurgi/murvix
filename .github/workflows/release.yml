name: Release

# Push a vX.Y.Z tag to release: the tag's commit is built for macOS +
# Omarchy (Linux desktop) and published on the GitHub release page with
# generated notes. To fix notes after the fact, edit them on the release
# page; pushing the tag again only fills in missing assets.
on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

concurrency:
  group: murvix-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'teomurgi/murvix' &&
      contains(fromJSON('["teomurgi"]'), github.actor) &&
      contains(fromJSON('["teomurgi"]'), github.triggering_actor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.count.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Derive the release version from the tag
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          python3 scripts/release.py check-version "$VERSION"
          if [[ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]]; then
            echo "Error: $TAG does not point to the pushed commit" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Count commits for the macOS bundle version
        id: count
        run: echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  build:
    if: >-
      github.repository == 'teomurgi/murvix' &&
      contains(fromJSON('["teomurgi"]'), github.actor) &&
      contains(fromJSON('["teomurgi"]'), github.triggering_actor)
    needs: prepare
    uses: ./.github/workflows/build-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      source: ${{ github.sha }}
      build_number: ${{ needs.prepare.outputs.build_number }}
    secrets: inherit

  release:
    if: >-
      github.repository == 'teomurgi/murvix' &&
      contains(fromJSON('["teomurgi"]'), github.actor) &&
      contains(fromJSON('["teomurgi"]'), github.triggering_actor)
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: distribution-*
          merge-multiple: true
          path: artifacts
      - name: Include the exact installers from this commit
        run: |
          cp scripts/install-murvix.sh scripts/install-desktop-linux.py artifacts/
          cp packaging/linux/murvix-desktop.apparmor artifacts/
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: bash scripts/publish-release.sh "$VERSION" artifacts
